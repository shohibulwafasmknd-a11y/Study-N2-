<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N2 Study</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5ff;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 22px 20px 15px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      margin: 0;
      color: #5133a5;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #666;
    }

    .container {
      padding: 18px;
      padding-bottom: 90px;
    }

    .progress-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 12px #00000012;
      margin-bottom: 15px;
    }

    .progress-title {
      font-size: 18px;
      font-weight: bold;
    }

    .progress-number {
      font-size: 38px;
      font-weight: bold;
      color: #5133a5;
      margin: 8px 0;
    }

    .progress-bar {
      height: 10px;
      background: #e5e0f5;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 35%;
      height: 100%;
      background: #6842d8;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }
